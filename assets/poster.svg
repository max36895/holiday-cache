<svg xmlns="http://www.w3.org/2000/svg" style="width:1080px;height:1350px;display:block" viewBox="0 0 1080 1350" role="img" aria-label="Постер Праздничного Тайника: распахнутый сундук в луче света среди звёзд и конфетти">
    <defs>
      <linearGradient id="pv-bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0C142C"></stop>
        <stop offset=".5" stop-color="#1B2A52"></stop>
        <stop offset="1" stop-color="#0A1128"></stop>
      </linearGradient>
      <radialGradient id="pv-vig" cx=".5" cy=".44" r=".78">
        <stop offset=".62" stop-color="#070D1E" stop-opacity="0"></stop>
        <stop offset="1" stop-color="#070D1E" stop-opacity=".6"></stop>
      </radialGradient>
      <radialGradient id="pv-glow" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#F4B942" stop-opacity=".32"></stop>
        <stop offset="1" stop-color="#F4B942" stop-opacity="0"></stop>
      </radialGradient>
      <linearGradient id="pv-beam" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#FFD98A" stop-opacity=".95"></stop>
        <stop offset="1" stop-color="#FFD98A" stop-opacity="0"></stop>
      </linearGradient>
      <linearGradient id="pv-lid" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#41598F"></stop>
        <stop offset="1" stop-color="#31447A"></stop>
      </linearGradient>
      <linearGradient id="pv-body" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#31447A"></stop>
        <stop offset="1" stop-color="#273960"></stop>
      </linearGradient>
      <!-- сундук без бейджа: герой сцены -->
      <g id="pv-sunduk">
        <path d="M250 244 L330 96 L392 224 Z" fill="url(#pv-beam)" opacity=".4"></path>
        <path d="M280 240 L332 150 L364 226 Z" fill="url(#pv-beam)" opacity=".85"></path>
        <circle cx="322" cy="104" r="10" fill="#F4B942"></circle>
        <rect x="372" y="130" width="17" height="17" rx="3" fill="#E4574D" transform="rotate(24 380 138)"></rect>
        <circle cx="388" cy="92" r="7.5" fill="#58C1B2"></circle>
        <rect x="296" y="88" width="15" height="15" rx="3" fill="#58C1B2" transform="rotate(-18 303 95)"></rect>
        <path d="M416 134c-7-8-21-3-21 9 0 9 12 17 21 23 9-6 21-14 21-23 0-12-14-17-21-9z" fill="#E4574D"></path>
        <path d="M344 54l6 18 18 6-18 6-6 18-6-18-18-6 18-6z" fill="#FFE9B8"></path>
        <circle cx="262" cy="110" r="6.5" fill="#E4574D"></circle>
        <rect x="404" y="84" width="15" height="15" rx="3" fill="#58C1B2" transform="rotate(40 411 91)"></rect>
        <path d="M252 140c-16-24 5-40 20-26" fill="none" stroke="#F4B942" stroke-width="6" stroke-linecap="round"></path>
        <rect x="136" y="266" width="240" height="142" rx="24" fill="url(#pv-body)"></rect>
        <rect x="178" y="266" width="20" height="142" fill="#F4B942"></rect>
        <rect x="314" y="266" width="20" height="142" fill="#F4B942"></rect>
        <g transform="rotate(-24 136 266)">
          <path d="M136 266v-44c0-50 54-80 120-80s120 30 120 80v44z" fill="url(#pv-lid)"></path>
          <rect x="136" y="248" width="240" height="18" rx="6" fill="#2A3B66"></rect>
          <rect x="178" y="188" width="20" height="78" fill="#F4B942"></rect>
          <rect x="314" y="188" width="20" height="78" fill="#F4B942"></rect>
        </g>
        <circle cx="256" cy="316" r="24" fill="#F4B942"></circle>
        <circle cx="256" cy="310" r="8" fill="#20305A"></circle>
        <rect x="251.5" y="312" width="9" height="15" rx="3.5" fill="#20305A"></rect>
      </g>
    </defs>

    <rect width="1080" height="1350" fill="url(#pv-bg)"></rect>

    <!-- звёздное небо -->
    <g fill="#8FA3D9">
      <circle cx="84" cy="120" r="2.4" opacity=".6"></circle><circle cx="212" cy="66" r="1.8" opacity=".45"></circle>
      <circle cx="988" cy="104" r="2.2" opacity=".55"></circle><circle cx="1042" cy="360" r="1.8" opacity=".4"></circle>
      <circle cx="52" cy="470" r="2" opacity=".45"></circle><circle cx="122" cy="760" r="2.2" opacity=".4"></circle>
      <circle cx="1016" cy="680" r="2.4" opacity=".45"></circle><circle cx="948" cy="930" r="1.8" opacity=".35"></circle>
      <circle cx="74" cy="1100" r="2.2" opacity=".4"></circle><circle cx="1014" cy="1180" r="2" opacity=".45"></circle>
      <circle cx="300" cy="1330" r="1.8" opacity=".35"></circle><circle cx="920" cy="50" r="1.6" opacity=".35"></circle>
      <circle cx="484" cy="42" r="1.8" opacity=".4"></circle><circle cx="742" cy="84" r="1.5" opacity=".3"></circle>
      <circle cx="388" cy="100" r="1.6" opacity=".35"></circle><circle cx="840" cy="1320" r="1.7" opacity=".35"></circle>
    </g>
    <g fill="#FFE9B8">
      <circle cx="168" cy="240" r="2" opacity=".5"></circle><circle cx="952" cy="272" r="2.2" opacity=".45"></circle>
      <circle cx="36" cy="940" r="2" opacity=".35"></circle><circle cx="1050" cy="1052" r="2" opacity=".4"></circle>
      <circle cx="620" cy="30" r="1.8" opacity=".35"></circle>
    </g>

    <!-- лучи из-за сундука -->
    <g fill="#F4B942" opacity=".06">
      <path d="M540 880 L240 380 L400 340 Z"></path>
      <path d="M540 880 L520 330 L640 320 Z"></path>
      <path d="M540 880 L840 400 L700 360 Z"></path>
      <path d="M540 880 L940 760 L900 900 Z"></path>
      <path d="M540 880 L150 820 L170 940 Z"></path>
    </g>

    <!-- ореол и сундук -->
    <circle cx="540" cy="820" r="300" fill="url(#pv-glow)"></circle>
    <ellipse cx="540" cy="964" rx="216" ry="20" fill="#060B18" opacity=".65"></ellipse>
    <g transform="translate(207,430) scale(1.3)"><use href="#pv-sunduk"></use></g>

    <!-- конфетти-дождь вокруг сундука -->
    <g opacity=".9">
      <rect x="210" y="600" width="13" height="13" rx="3" fill="#E4574D" transform="rotate(28 216 606)"></rect>
      <circle cx="170" cy="700" r="5.5" fill="#F4B942"></circle>
      <rect x="880" y="620" width="13" height="13" rx="3" fill="#58C1B2" transform="rotate(-20 886 626)"></rect>
      <circle cx="930" cy="730" r="5" fill="#E4574D"></circle>
      <path d="M250 500l5 15 15 5-15 5-5 15-5-15-15-5 15-5z" fill="#FFE9B8" opacity=".9"></path>
      <path d="M852 480l4 13 13 4-13 4-4 13-4-13-13-4 13-4z" fill="#FFE9B8" opacity=".8"></path>
      <path d="M120 1178c-6-7-18-3-18 8 0 8 10 14 18 20 8-6 18-12 18-20 0-11-12-15-18-8z" fill="#E4574D" opacity=".85"></path>
      <rect x="760" y="1100" width="14" height="14" rx="3" fill="#F4B942" transform="rotate(32 767 1107)" opacity=".85"></rect>
    </g>

    <!-- название -->
    <text x="540" y="206" text-anchor="middle" font-family="'Segoe UI','PT Sans',system-ui,sans-serif" font-size="50" font-weight="500" letter-spacing="24" fill="#F4B942">ПРАЗДНИЧНЫЙ</text>
    <path d="M190.28 356L162.76 356L162.76 258.30L124.40 258.30L124.40 235.60L228.80 235.60L228.80 258.30L190.28 258.30L190.28 356Z M269.31 356L240.76 356L294.42 235.60L321.94 235.60L375.78 356L346.54 356L335.88 330.20L279.98 330.20L269.31 356ZM288.92 309.04L327.10 309.04L308.01 262.95L288.92 309.04Z M426.09 356L399.78 356L399.78 235.60L427.47 235.60L427.47 314.03L484.92 235.60L511.06 235.60L511.06 356L483.54 356L483.54 277.74L426.09 356ZM455.33 227.86L455.33 227.86Q438.13 227.86 430.13 220.98Q422.14 214.10 421.96 201.54L421.96 201.54L441.06 201.54Q441.23 207.74 444.75 210.92Q448.28 214.10 455.33 214.10L455.33 214.10Q462.21 214.10 465.82 210.92Q469.44 207.74 469.61 201.54L469.61 201.54L488.70 201.54Q488.53 214.10 480.44 220.98Q472.36 227.86 455.33 227.86Z M631.55 283.07L631.55 235.60L659.41 235.60L659.41 356L631.55 356L631.55 306.64L576.85 306.64L576.85 356L548.99 356L548.99 235.60L576.85 235.60L576.85 283.07L631.55 283.07Z M723.83 356L697.51 356L697.51 235.60L725.20 235.60L725.20 314.03L782.65 235.60L808.80 235.60L808.80 356L781.28 356L781.28 277.74L723.83 356Z M956.29 356L924.64 356L893.34 307.50L874.07 307.50L874.07 356L846.38 356L846.38 235.60L874.07 235.60L874.07 284.28L894.02 284.28L925.67 235.60L955.08 235.60L915.70 293.74L956.29 356Z" fill="#FFF6E0"></path>
    <text x="540" y="432" text-anchor="middle" font-family="'Segoe UI','PT Sans',system-ui,sans-serif" font-size="37" fill="#8FA3D9">праздники прячутся здесь</text>

    <!-- режимы одной строкой -->
    <text x="540" y="1152" text-anchor="middle" font-family="'Segoe UI','PT Sans',system-ui,sans-serif" font-size="31" font-weight="500" fill="#E9C983">Санта · Валентинки · Даритель · Дни рождения · Встречи</text>

    <!-- платформы -->
    <rect x="150" y="1212" width="780" height="84" rx="42" fill="#22345F"></rect>
    <text x="540" y="1248" text-anchor="middle" font-family="'Segoe UI','PT Sans',system-ui,sans-serif" font-size="29" font-weight="700" fill="#FFF6E0">Telegram · VK · MAX · Алиса</text>
    <text x="540" y="1282" text-anchor="middle" font-family="'Segoe UI','PT Sans',system-ui,sans-serif" font-size="24" fill="#A9B9E2">одна игра по коду комнаты — без регистрации</text>

    <rect width="1080" height="1350" fill="url(#pv-vig)"></rect>
  </svg>
